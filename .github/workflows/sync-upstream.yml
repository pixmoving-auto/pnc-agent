name: Sync Upstream

on:
  schedule:
    # 每天 UTC 时间 02:00 / 06:00 / 14:00 / 22:00 自动检查上游更新
    - cron: '0 2,6,14,22 * * *'
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/leon-nie-pnc/pnc-agent.git
          git fetch upstream

      - name: Check if upstream has new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo 0)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "当前落后上游 $BEHIND 个提交"

      - name: Merge upstream changes
        if: steps.check.outputs.behind > 0
        run: |
          git merge upstream/main --no-edit
          echo "已合并上游更新"

      - name: Push changes
        if: steps.check.outputs.behind > 0
        run: |
          git push origin main
          echo "已推送到 pixmoving-auto/pnc-agent main 分支"

      - name: No update needed
        if: steps.check.outputs.behind == 0
        run: |
          echo "当前已经是最新，无需同步"
